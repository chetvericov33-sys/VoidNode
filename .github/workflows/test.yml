name: Tests

on:
  push:
    branches:
      - main
      - fix/security-hardening-phase-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools
      - name: Install dependencies
        run: npm ci
      - name: Run unit and static tests
        run: npm test
      - name: Run Redis integration tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: npm run test:integration:redis
